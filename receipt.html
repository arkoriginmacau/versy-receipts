<script>
/* Versy host shell — multi-receipt persistence (host 0.2) */
(function(){
  const INDEX_KEY = 'versy-receipts-index-v1';
  function ridAndKind(){
    const q = new URLSearchParams(location.search);
    let id = q.get('id');
    let kind = (q.get('kind')||'').toLowerCase();
    if(kind === 'paid' || kind === 'paidinfull' || kind === 'paid_in_full') kind = 'paid-in-full';
    if(kind !== 'paid-in-full') kind = 'regular';
    let view = (q.get('view')||'').toLowerCase();
    if(view === 'one-page' || view === 'small' || view === 'onepage') view = 'one-page';
    else if(view === 'full') view = 'full';
    else view = '';
    if(!id){
      id = 'r-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2,8);
      q.set('id', id);
      if(kind === 'paid-in-full') q.set('kind', kind);
      if(view) q.set('view', view);
      history.replaceState(null, '', location.pathname + '?' + q.toString() + location.hash);
    }
    return { id, kind, view };
  }
  const boot = ridAndKind();
  window.__VERSY_RECEIPT_ID = boot.id;
  window.__VERSY_RECEIPT_KIND = boot.kind;
  window.__VERSY_RECEIPT_VIEW = boot.view;
  window.__VERSY_INDEX_KEY = INDEX_KEY;
  window.__VERSY_HOST = '0.2';
  window.__versyUpsertIndex = function(meta){
    try{
      const raw = localStorage.getItem(INDEX_KEY);
      let list = raw ? JSON.parse(raw) : [];
      if(!Array.isArray(list)) list = [];
      const id = window.__VERSY_RECEIPT_ID;
      const i = list.findIndex(x => x && x.id === id);
      const row = Object.assign({ id, updatedAt: Date.now(), kind: window.__VERSY_RECEIPT_KIND||'regular' }, meta||{});
      if(row.receiptNo!=null&&typeof row.receiptNo==='object') row.receiptNo = String(row.receiptNo.current||row.receiptNo.no||row.receiptNo.receiptNo||'');
      else if(row.receiptNo!=null) row.receiptNo = String(row.receiptNo);
      if(row.title!=null&&typeof row.title==='object') row.title = String(row.title.en||row.title.title||'Untitled receipt');
      if(i >= 0) list[i] = Object.assign({}, list[i], row);
      else list.unshift(row);
      list.sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
      list = list.slice(0, 50);
      localStorage.setItem(INDEX_KEY, JSON.stringify(list));
    }catch(e){}
  };
})();
</script>

}]}, {"en": "Price", "zh": "價錢", "kind": "text"}, {"en": "Subject Description", "zh": "作品描述", "kind": "area"}, {"en": "Canvas Edge Colour", "zh": "畫布邊緣顏色", "kind": "checks", "options": [{"en": "Red", "zh": "紅色"}, {"en": "Custom", "zh": "自訂", "entry": "auto"}]}]}, {"id": "b10", "type": "heading", "en": "Payment", "zh": "付款"}, {"id": "b11", "type": "subheading", "en": "Finished artwork", "zh": "成品作品"}, {"id": "b12", "type": "fields", "rows": [{"en": "Full Payment", "zh": "全額支付", "kind": "checks", "options": [{"id": "paidfull", "en": "Paid in full", "zh": "已全額支付"}]}, {"en": "Amount Paid", "zh": "已付金額", "kind": "text"}]}, {"id": "b13", "type": "subheading", "en": "Custom artwork (50% deposit before work commences)", "zh": "訂做作品（開始創作前須支付 50% 訂金）", "strikeWhen": "paidfull"}, {"id": "b14", "type": "fields", "rows": [{"en": "Deposit Paid (50%)", "zh": "已付訂金", "kind": "text"}], "strikeWhen": "paidfull"}, {"id": "b15", "type": "heading", "en": "Terms & Conditions", "zh": "條款及細則", "pageBreak": true}, {"id": "b16", "type": "clauses", "items": [{"n": "1", "en": "Custom orders: I understand that a 50% deposit is required before work commences.", "zh": "訂做作品：本人理解在工作開始前需支付 50% 的訂金。"}, {"n": "2", "en": "Upon completion of a custom artwork, the remaining 50% balance is due.", "zh": "畫作完成後，需支付剩餘的 50% 尾款。"}, {"n": "3", "en": "All deposits are non-refundable.", "zh": "所有訂金均不予退還。"}, {"n": "4", "en": "The date marked on the painting is its completion date, subject to a deviation of a few days.", "zh": "畫作上標註的日期為作品完成日期，可能有幾天的誤差。"}, {"n": "5", "en": "Varnishing will be carried out only one year after the completion date marked on the painting.", "zh": "畫作的上光油僅會在完成日期一年後進行。"}, {"n": "6", "en": "All sales are final and non-refundable. Buyers are responsible for inspecting the condition of the artwork before completing the purchase.", "zh": "所有畫作均不接受退貨；因此，買家需在完成購買前自行檢查作品狀況。"}, {"n": "7", "en": "Framing: paintings that need framing require screws to be drilled into the stretcher bars for fixation.", "zh": "裝框：需要裝框的畫作必須在畫框木條上鑽入螺絲以固定。"}]}, {"id": "b17", "type": "spacer", "h": 10}, {"id": "b18", "type": "fields", "rows": [{"en": "Proceed with framing?", "zh": "是否進行裝框？", "kind": "checks", "options": [{"en": "Yes", "zh": "是"}, {"en": "No", "zh": "否"}]}]}, {"id": "b19", "type": "heading", "en": "Agreement", "zh": "協議"}, {"id": "b20", "type": "clauses", "items": [{"n": "A", "en": "I acknowledge that I have read and fully understand the terms outlined above.", "zh": "本人確認已閱讀並完全理解上述條款。"}, {"n": "B", "en": "I agree to fulfil the financial obligations as indicated herein.", "zh": "本人同意履行本協議所列之財務責任。"}]}, {"id": "b21", "type": "text", "bold": true, "en": "By signing below, you confirm your acceptance of all of the above terms.", "zh": "於下方簽名即表示您同意並接受上述所有條款。"}, {"id": "b22", "type": "signatures", "lines": [{"en": "Buyer’s signature", "zh": "買方簽名"}, {"en": "For Arkorigin 鳳仙", "zh": "商戶簽署"}], "dateEn": "Date", "dateZh": "日期"}, {"id": "b23", "type": "heading", "en": "Care & Maintenance", "zh": "保養指南", "pageBreak": true}, {"id": "b24", "type": "care", "groups": [{"en": "Varnished Paintings", "zh": "已上光畫作", "items": [{"en": "Varnish enhances colour and protects the painting, but periodic cleaning and inspection are still recommended to guard against dust accumulation and wear over time.", "zh": "上光油能增強色彩並保護畫作，但仍建議定期清潔與檢查，以防灰塵累積及長期磨損。"}]}, {"en": "Non-Varnished Paintings", "zh": "未上光畫作", "items": [{"en": "Handle with care and protect from dust, pollutants and direct touch.", "zh": "需小心處理，避免灰塵、污染物及直接接觸。"}, {"en": "With no protective varnish layer, take extra caution when cleaning to avoid damaging the delicate surface.", "zh": "因缺乏保護層，清潔與保存時需格外謹慎，以免損傷脆弱表面。"}]}, {"en": "General Care", "zh": "一般保養", "items": [{"en": "Keep all oil paintings, varnished or not, in a stable environment with controlled temperature and humidity.", "zh": "所有油畫（無論是否上光）皆需置於溫度與濕度穩定的環境中。"}, {"en": "Inspect regularly and dust gently to prevent particle build-up that can affect the integrity of the artwork.", "zh": "定期檢查與輕柔除塵，以防止灰塵堆積影響作品完整性。"}, {"en": "Avoid direct sunlight and extreme temperatures, which can cause fading and deterioration.", "zh": "避免將畫作暴露於直射陽光及極端溫度下，以免褪色及劣化。"}]}, {"en": "Long-Term Preservation", "zh": "長期保存", "items": [{"en": "For long-term preservation, arrange periodic professional inspection for signs of ageing or degradation.", "zh": "為長期保存油畫，建議定期由專業人士檢查老化或劣化的跡象。"}]}]}, {"id": "b25", "type": "heading", "en": "Art Piece Checking", "zh": "藝術品檢查", "pageBreak": true}, {"id": "b26", "type": "steps", "items": [{"en": "Scan the QR code, or visit {website} and click “Full body of work”.", "zh": "掃描 QR 碼，或前往 {website} 並點選「Full body of work（全部作品）」。"}, {"en": "Enter the serial number or the name of the painting to view all of its details.", "zh": "輸入序號或畫作名稱，即可顯示所有詳細資訊。"}, {"en": "The serial number is always on the bottom side of the painting; the name is always on the bottom right side.", "zh": "序號永遠位於畫作底部；畫作名稱永遠位於右下角。"}], "qrText": "{website}", "image": "", "capEn": "Scan to inspect", "capZh": "掃描檢查"}, {"id": "b27", "type": "images", "items": [{"src": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBAUEBAYFBQUGBgYHCQ4JCQgICRINDQoOFRIWFhUSFBQXGiEcFxgfGRQUHScdHyIjJSUlFhwpLCgkKyEkJST/2wBDAQYGBgkICREJCREkGBQYJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCT/wAARCALQAh0DASIAAhEBAxEB/8QAHAAAAQUBAQEAAAAAAAAAAAAABAIDBQYHAQAI/8QATxAAAgEDAwIEBAMGAwUGBAENAQIDAAQRBRIhBjETQVFhByJxgRQykQgjQqGxwRUz0VJicuHwFiRDgsLxJTREkqJjshcmU+JGVHOTlLPD/8QAGgEAAgMBAQAAAAAAAAAAAAAAAgMBBAUABv/EADARAAICAQQABgICAgEEAwAAAAABAhEDBBIhMQUTIkFRYSMyM3EUgUKRscHRJDRS/9oADAMBAAIRAxEAPwDHNwHYVwvxwDTgUDyrwUHyx9az7NpjRyea4EbOaf7d68MeVddnJDIRgcGlgBQeKWf61wtz9fKoOY0c5rx+nNOEZ5wa4Y89vKpsihMK5bNPiOmVYoTg1wyN5GoohOgjao5z9q6WUDk8UIdx7scUnJPnU0TYZ4iDPNcMqexoUKfWvAjGP1rqOsfNyvYVz8SFPrTGF/SvEe/NdRA9+KbOADR2lapLZXSyg4XPIqMHFOLn0xXVXRDV8GtWs6XtqkyYJxzXQCDyKpnSWuvbyfhZW+U/lzV04OGB4Paj+ylKO10d8uKbYfal5z/13pDhjx6VAJzcFHHNJZix+WuMM8cAUVZPbhCZCNw8qKJz4HLbRri6gMnOO+asXwutDFrGpXLf/T2xAPuT/w 	mapData : function(data, maskPattern) {
		
		var inc = -1;
		var row = this.moduleCount - 1;
		var bitIndex = 7;
		var byteIndex = 0;
		
		for (var col = this.moduleCount - 1; col > 0; col -= 2) {
	
			if (col === 6) col--;
	
			while (true) {
	
				for (var c = 0; c < 2; c++) {
					
					if (this.modules[row][col - c] === null) {
						
						var dark = false;
	
						if (byteIndex < data.length) {
							dark = ( ( (data[byteIndex] >>> bitIndex) & 1) === 1);
						}
	
						var mask = QRUtil.getMask(maskPattern, row, col - c);
	
						if (mask) {
							dark = !dark;
						}
						
						this.modules[row][col - c] = dark;
						bitIndex--;
	
						if (bitIndex === -1) {
							byteIndex++;
							bitIndex = 7;
						}
					}
				}
								
				row += inc;
	
				if (row < 0 || this.moduleCount <= row) {
					row -= inc;
					inc = -inc;
					break;
				}
			}
		}
		
	}

};

QRCode.PAD0 = 0xEC;
QRCode.PAD1 = 0x11;

QRCode.createData = function(typeNumber, errorCorrectLevel, dataList) {
	
	var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectLevel);
	
	var buffer = new QRBitBuffer();
	
	for (var i = 0; i < dataList.length; i++) {
		var data = dataList[i];
		buffer.put(data.mode, 4);
		buffer.put(data.getLength(), QRUtil.getLengthInBits(data.mode, typeNumber) );
		data.write(buffer);
	}

	// calc num max data.
	var totalDataCount = 0;
	for (var x = 0; x < rsBlocks.length; x++) {
		totalDataCount += rsBlocks[x].dataCount;
	}

	if (buffer.getLengthInBits() > totalDataCount * 8) {
		throw new Error("code length overflow. (" + 
            buffer.getLengthInBits() + 
            ">" +  
            totalDataCount * 8 + 
            ")");
	}

	// end code
	if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
		buffer.put(0, 4);
	}

	// padding
	while (buffer.getLengthInBits() % 8 !== 0) {
		buffer.putBit(false);
	}

	// padding
	while (true) {
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD0, 8);
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD1, 8);
	}

	return QRCode.createBytes(buffer, rsBlocks);
};

QRCode.createBytes = function(buffer, rsBlocks) {

	var offset = 0;
	
	var maxDcCount = 0;
	var maxEcCount = 0;
	
	var dcdata = new Array(rsBlocks.length);
	var ecdata = new Array(rsBlocks.length);
	
	for (var r = 0; r < rsBlocks.length; r++) {

		var dcCount = rsBlocks[r].dataCount;
		var ecCount = rsBlocks[r].totalCount - dcCount;

		maxDcCount = Math.max(maxDcCount, dcCount);
		maxEcCount = Math.max(maxEcCount, ecCount);
		
		dcdata[r] = new Array(dcCount);
		
		for (var i = 0; i < dcdata[r].length; i++) {
			dcdata[r][i] = 0xff & buffer.buffer[i + offset];
		}
		offset += dcCount;
		
		var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
		var rawPoly = new QRPolynomial(dcdata[r], rsPoly.getLength() - 1);

		var modPoly = rawPoly.mod(rsPoly);
		ecdata[r] = new Array(rsPoly.getLength() - 1);
		for (var x = 0; x < ecdata[r].length; x++) {
            var modIndex = x + modPoly.getLength() - ecdata[r].length;
			ecdata[r][x] = (modIndex >= 0)? modPoly.get(modIndex) : 0;
		}

	}
	
	var totalCodeCount = 0;
	for (var y = 0; y < rsBlocks.length; y++) {
		totalCodeCount += rsBlocks[y].totalCount;
	}

	var data = new Array(totalCodeCount);
	var index = 0;

	for (var z = 0; z < maxDcCount; z++) {
		for (var s = 0; s < rsBlocks.length; s++) {
			if (z < dcdata[s].length) {
				data[index++] = dcdata[s][z];
			}
		}
	}

	for (var xx = 0; xx < maxEcCount; xx++) {
		for (var t = 0; t < rsBlocks.length; t++) {
			if (xx < ecdata[t].length) {
				data[index++] = ecdata[t][xx];
			}
		}
	}

	return data;

};

/* ---------- tiny DOM builder ---------- */
function h(tag,props,...kids){
 const e=document.createElement(tag);
 for(const k in props||{}){const v=props[k];
  if(k==='class')e.className=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);
  else if(v!==false&&v!=null)e.setAttribute(k,v===true?'':v);}
 for(const kid of kids.flat(9)){if(kid==null||kid===false)continue;e.append(kid.nodeType?kid:document.createTextNode(kid));}
 return e;
}

const todayISO=()=>{const t=new Date(),p=n=>String(n).padStart(2,'0');return t.getFullYear()+'-'+p(t.getMonth()+1)+'-'+p(t.getDate());};
function fmtNo(n,y){const r=state.receipt;return [r.prefix||'',r.yearly?String(y):'',String(Math.max(1,Math.floor(n)||1)).padStart(Math.max(1,Math.min(8,Math.floor(+r.digits)||3)),'0')].filter(Boolean).join('-');}
function nextPreview(){if(state.receipt.rnd)return fmtNo(0,new Date().getFullYear()).replace(/\d+$/,m=>'#'.repeat(m.length))+' (random)';const r=state.receipt,y=new Date().getFullYear();return r.yearly&&r.year!==y?fmtNo(1,y):fmtNo(r.next,r.year);}
function issueNo(){
 const r=state.receipt,y=new Date().getFullYear();
 if(r.yearly&&r.year!==y){r.year=y;r.next=1;}
 r.next=Math.max(1,Math.floor(+r.next)||1);
 let no=fmtNo(r.next,r.year);
 if(r.rnd){r.digits=Math.max(4,Math.floor(+r.digits)||6);const lo=Math.pow(10,r.digits-1),span=9*lo;let g=0;do{no=fmtNo(lo+Math.floor(Math.random()*span),r.year);}while(r.log.some(l=>l.no===no)&&++g<500);}
 else while(r.log.some(l=>l.no===no)){r.next++;no=fmtNo(r.next,r.year);}
 r.log.unshift({no,date:todayISO(),void:false,note:''});
 r.current=no;r.printed=false;r.next++;save(true);return no;
}
function newReceipt(){

  location.href='receipt.html?id='+encodeURIComponent(nid);

}

   state.settings=Object.assign({},state.settings,{accent:pre.accent,headerRight:pre.headerRight});

  }

  }catch(e){}
  try{save(true);}catch(e){}
  buildBar();renderSheet();window.scrollTo({top:0});

 }

 state.kind='paid-in-full';

function blobToBase64(blob){
 return new Promise((resolve,reject)=>{
  const r=new FileReader();
  r.onload=()=>{const s=String(r.result||'');const i=s.indexOf(',');resolve(i>=0?s.slice(i+1):s);};
  r.onerror=reject;r.readAsDataURL(blob);

}
function localStoreKey(){return 'versy-storage-local-v1';}
function readLocalStore(){
 try{const raw=localStorage.getItem(localStoreKey());const j=raw?JSON.parse(raw):{files:[]};if(!Array.isArray(j.files))j.files=[];return j;}catch(e){return {files:[]};}
}
function writeLocalStore(j){
 /* metadata only — never put PDF data URLs here (quota). Strip any accidental url payloads. */
 const light={files:(j.files||[]).map(f=>{
  const o=Object.assign({},f);
  if(o.url&&String(o.url).indexOf('data:')===0){o.url='idb:'+(o.pathname||o.filename||Math.random());}
  return o;
 })};
 try{localStorage.setItem(localStoreKey(),JSON.stringify(light));}catch(e){
  throw new Error('Browser storage full — clear old receipts or free space');
 }
}
const IDB_NAME='versy-storage-pdfs-v1', IDB_STORE='pdfs';
function idbOpen(){
 return new Promise(function(resolve,reject){
  try{
   const req=indexedDB.open(IDB_NAME,1);
   req.onupgradeneeded=function(){
    const db=req.result;
    if(!db.objectStoreNames.contains(IDB_STORE))db.createObjectStore(IDB_STORE);
   };
   req.onsuccess=function(){resolve(req.result);};
   req.onerror=function(){reject(req.error||new Error('IndexedDB open failed'));};
  }catch(e){reject(e);}
 });
}
function idbPutPdf(key, blob){
 return idbOpen().then(function(db){
  return new Promise(function(resolve,reject){
   const tx=db.transaction(IDB_STORE,'readwrite');
   tx.objectStore(IDB_STORE).put(blob, key);
   tx.oncomplete=function(){resolve(key);};
   tx.onerror=function(){reject(tx.error||new Error('IndexedDB write failed'));};
  });
 });
}
function idbGetPdf(key){
 return idbOpen().then(function(db){
  return new Promise(function(resolve,reject){
   const tx=db.transaction(IDB_STORE,'readonly');
   const req=tx.objectStore(IDB_STORE).get(key);
   req.onsuccess=function(){resolve(req.result||null);};
   req.onerror=function(){reject(req.error||new Error('IndexedDB read failed'));};
  });
 });
}
function idbDelPdf(key){
 return idbOpen().then(function(db){
  return new Promise(function(resolve,reject){
   const tx=db.transaction(IDB_STORE,'readwrite');
   tx.objectStore(IDB_STORE).delete(key);
   tx.oncomplete=function(){resolve();};
   tx.onerror=function(){reject(tx.error);};
  });
 }).catch(function(){});
}
function localStoreDel(file){
 const j=readLocalStore();
 const before=j.files.length;
 const path=file&&file.pathname;
 const fk=formatKey(file&&file.receiptNo, file&&file.view||'full', file&&file.kind||'regular');
 j.files=(j.files||[]).filter(f=>{
  if(path&&f.pathname===path)return false;
  if(formatKey(f.receiptNo,f.view||'full',f.kind||'regular')===fk)return false;
  return true;
 });
 if(j.files.length!==before)writeLocalStore(j);
 return before-j.files.length;
}
function localStoreDelFolder(receiptNo){
 const j=readLocalStore();
 const want=String(receiptNo||'').toLowerCase();
 const removed=(j.files||[]).filter(f=>String(f.receiptNo||'').toLowerCase()===want);
 j.files=(j.files||[]).filter(f=>String(f.receiptNo||'').toLowerCase()!==want);
 writeLocalStore(j);
 return removed;
}
function remoteKeysFor(file){
 const keys=[];
 if(!file)return keys;
 const add=k=>{k=String(k||'').replace(/^\/+/, '');if(k.startsWith('receipts/')&&!k.includes('..')&&keys.indexOf(k)<0)keys.push(k);};
 add(file.pathname);add(file.key);
 const no=file.receiptNo;
 if(no){
  [no,String(no).toLowerCase(),String(no).toUpperCase()].forEach(n=>{
   add('receipts/'+n+'/'+displayPdfName(no, file.view||'full', file.kind||'regular'));
   add('receipts/'+n+'/'+displayPdfName(String(no).toLowerCase(), file.view||'full', file.kind||'regular'));
   add(stablePathname(n, file.view||'full', file.kind||'regular'));
  });
 }
 return keys;
}
function deleteStoredPdf(file){
 file=file||{};
 const keys=remoteKeysFor(file);
 const api=deleteApiUrl();
 const jobs=[];
 if(api){
  keys.forEach(function(key){
   jobs.push(fetch(api,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:key})}).then(async r=>{
    let j=null;try{j=await r.json();}catch(e){}
    if(!r.ok)throw new Error((j&&j.error)||('HTTP '+r.status));
    return j;
   }).catch(function(err){console.warn('Cloud delete failed',key,err);return null;}));
  });
 }
 /* always clear local mirror */
 localStoreDel(file);
 keys.forEach(function(k){jobs.push(idbDelPdf(k));});
 return Promise.all(jobs).then(function(){
  pdfToast('Deleted · '+(file.filename||keys[0]||'file'),true);
  return {ok:true};
 });
}
function deleteStoredFolder(receiptNo){
 const no=String(receiptNo||'').trim();
 if(!no)return Promise.resolve({ok:false});
 const api=deleteApiUrl();
 const localFiles=localFilesFor(no);
 const jobs=[];
 if(api){
  jobs.push(fetch(api,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({no:no})}).then(async r=>{
   let j=null;try{j=await r.json();}catch(e){}
   if(!r.ok)throw new Error((j&&j.error)||('HTTP '+r.status));
   return j;
  }).catch(function(err){console.warn('Cloud folder delete failed',err);return null;}));
 }
 localFiles.forEach(function(f){if(f.pathname)jobs.push(idbDelPdf(f.pathname));});
 localStoreDelFolder(no);
 return Promise.all(jobs).then(function(){
  pdfToast('Deleted folder · '+no,true);
  return {ok:true};
 });
}

function formatKey(receiptNo, view, kind){
 return String(receiptNo||'').toLowerCase()+'|'+String(view||'full')+'|'+String(kind||'regular');
}
function stablePathname(receiptNo, view, kind){
 return 'receipts/'+receiptNo+'/'+(view||'full')+'-'+(kind||'regular')+'.pdf';
}
function displayPdfName(receiptNo, view, kind){
 const v=(view==='one-page'||view==='small')?'one-page':'full';
 const k=kind==='paid-in-full'?'paid-in-full':'regular';
 let typeLabel;
 if(k==='paid-in-full') typeLabel = v==='one-page' ? 'Paid-in-full-one-page' : 'Paid-in-full';
 else typeLabel = v==='one-page' ? 'One-page-receipt' : 'Full-receipt';
 return typeLabel+'-'+String(receiptNo||'receipt')+'.pdf';
}
function dedupeFilesByFormat(files){
 const best=new Map();
 (files||[]).forEach(f=>{
  const k=formatKey(f.receiptNo, f.view||'full', f.kind||'regular');
  const prev=best.get(k);
  const ts=+f.uploadedAt||0;
  if(!prev||ts>=(+prev.uploadedAt||0))best.set(k,f);
 });
 return [...best.values()].sort((a,b)=>(+b.uploadedAt||0)-(+a.uploadedAt||0));
}
function migrateLocalFileNames(){
 const j=readLocalStore();
 let changed=false;
 j.files=(j.files||[]).map(f=>{
  const view=f.view||'full', kind=f.kind||'regular', no=f.receiptNo||'receipt';
  const want=displayPdfName(no, view, kind);
  const wantPath=stablePathname(no, view, kind);
  const next=Object.assign({},f,{filename:want,pathname:wantPath});
  if(next.url&&String(next.url).indexOf('data:')===0){
   /* drop heavy data URLs from metadata — PDF should live in IndexedDB */
   next.url='idb:'+wantPath;
   changed=true;
  }
  if(f.filename!==want||f.pathname!==wantPath)changed=true;
  return next;
 });
 if(changed)writeLocalStore(j);
 return j;
}
function scrubLocalStoreDuplicates(){
 migrateLocalFileNames();
 const j=readLocalStore();
 const before=j.files.length;
 j.files=dedupeFilesByFormat(j.files);
 let renamed=false;
 j.files=j.files.map(f=>{
  const filename=displayPdfName(f.receiptNo, f.view||'full', f.kind||'regular');
  const pathname=stablePathname(f.receiptNo, f.view||'full', f.kind||'regular');
  let url=f.url;
  if(url&&String(url).indexOf('data:')===0){url='idb:'+pathname;renamed=true;}
  if(!url){url='idb:'+pathname;renamed=true;}
  if(f.filename!==filename||f.pathname!==pathname||f.url!==url){renamed=true;return Object.assign({},f,{filename,pathname,url});}
  return f;
 });
 if(j.files.length!==before||renamed)writeLocalStore(j);
 return j;
}
function localStorePut(entry){
 entry.receiptNo=normalizeReceiptNo(entry.receiptNo)||entry.receiptNo;
 const j=scrubLocalStoreDuplicates();
 const view=entry.view||'full', kind=entry.kind||'regular';
 entry.view=view;entry.kind=kind;
 entry.pathname=stablePathname(entry.receiptNo, view, kind);
 entry.filename=displayPdfName(entry.receiptNo, view, kind);
 if(!entry.url||String(entry.url).indexOf('data:')===0)entry.url='idb:'+entry.pathname;
 j.files=j.files.filter(f=>formatKey(f.receiptNo,f.view,f.kind)!==formatKey(entry.receiptNo,view,kind));
 j.files.unshift(entry);
 j.files=j.files.slice(0,80);
 writeLocalStore(j);
 return entry;
}
function remapLocalSerials(){
 const j=readLocalStore();
 let changed=false;
 j.files=(j.files||[]).map(f=>{
  const no=String(f&&f.receiptNo||'');
  const ark=normalizeReceiptNo(no);
  if(!ark||no===ark)return f;
  const view=f.view||'full', kind=f.kind||'regular', pathname=stablePathname(ark,view,kind);
  const oldPath=f.pathname;
  if(oldPath&&oldPath!==pathname){idbGetPdf(oldPath).then(b=>{if(b)return idbPutPdf(pathname,b).then(()=>idbDelPdf(oldPath));}).catch(function(){});}
  changed=true;
  return Object.assign({},f,{receiptNo:ark,pathname:pathname,filename:displayPdfName(ark,view,kind),url:'idb:'+pathname});
 });
 if(changed){
  const seen=new Set();
  j.files=j.files.filter(f=>{const k=formatKey(f.receiptNo,f.view,f.kind);if(seen.has(k))return false;seen.add(k);return true;});
  writeLocalStore(j);
 }
}
function scrubJunkLocalFolders(){
 remapLocalSerials();
 const j=readLocalStore();
 const junkNos=new Set();
 (j.files||[]).forEach(f=>{
  if(isJunkReceiptFolder(f&&f.receiptNo))junkNos.add(String(f.receiptNo));
 });
 junkNos.forEach(no=>{try{localStoreDelFolder(no);}catch(e){}});
}
function localFolders(){
 scrubLocalStoreDuplicates();
 scrubJunkLocalFolders();
 const map=new Map();
 readLocalStore().files.forEach(f=>{
  const no=f.receiptNo||'?';
  if(isJunkReceiptFolder(no))return;
  const key=String(no).toLowerCase();
  const row=map.get(key)||{receiptNo:no,count:0,latest:0,local:true};
  row.count++;row.latest=Math.max(row.latest,f.uploadedAt||0);
  if(/^ARK-/i.test(no)&&!/^ARK-/i.test(row.receiptNo))row.receiptNo=no;
  map.set(key,row);
 });
 return [...map.values()].sort((a,b)=>(b.latest||0)-(a.latest||0));
}
function localFilesFor(receiptNo){
 scrubLocalStoreDuplicates();
 const want=String(receiptNo||'').toLowerCase();
 return dedupeFilesByFormat(readLocalStore().files.filter(f=>String(f.receiptNo||'').toLowerCase()===want));
}
function storageMode(){
 return uploadApiUrl()?'cloud':'local';
}
function storeReceiptPdf(blob, opts){
 opts=opts||{};
 const receiptNo=normalizeReceiptNo(opts.receiptNo)||normalizeReceiptNo(opts.filename)||normalizeReceiptNo(state.receipt&&state.receipt.current);
 if(!receiptNo){
  pdfToast('Not stored — no ARK- receipt number',false);
  return Promise.resolve(null);
 }
 const kind=opts.source==='drop'?'regular':(opts.kind==='paid-in-full'?'paid-in-full':'regular');
 const view=opts.view==='one-page'?'one-page':'full';
 const pathname=stablePathname(receiptNo, view, kind);
 const filename=displayPdfName(receiptNo, view, kind);
 const api=uploadApiUrl();
 const pdfBlob=(blob&&blob.type==='application/pdf')?blob:new Blob([blob],{type:'application/pdf'});
 const finishLocal=function(){
  return idbPutPdf(pathname, pdfBlob).then(function(){
   localStorePut({receiptNo:receiptNo,kind:kind,view:view,filename:filename,pathname:pathname,url:'idb:'+pathname,uploadedAt:Date.now(),local:true,size:pdfBlob.size||0});
   const verify=localFilesFor(receiptNo).some(function(f){return f.kind===kind&&(f.view||'full')===view;});
   if(!verify)throw new Error('Metadata write failed');
   return idbGetPdf(pathname).then(function(got){
    if(!got)throw new Error('IndexedDB write failed');
    pdfToast('Stored under '+receiptNo+' · '+filename+(api?'':' (local)'),true);
    return {ok:true,local:true,pathname:pathname,receiptNo:receiptNo,kind:kind,view:view,filename:filename};
   });
  });
 };
 if(!api){
  pdfToast('Saving in this browser…',null);
  return finishLocal().catch(function(err){pdfToast(String(err&&err.message||err),false);return null;});
 }
 pdfToast('Storing on Cloudflare…',null);
 return blobToBase64(pdfBlob).then(function(pdfBase64){
  return fetch(api,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({receiptNo:receiptNo,kind:kind,view:view,filename:filename,source:opts.source,pdfBase64:pdfBase64})});
 }).then(async function(r){
  let j=null;try{j=await r.json();}catch(e){}
  if(!r.ok)throw new Error((j&&j.error)||('HTTP '+r.status));
  /* also mirror metadata+blob locally so Storage list works offline */
  try{await idbPutPdf(pathname, pdfBlob);localStorePut({receiptNo:receiptNo,kind:kind,view:view,filename:filename,pathname:pathname,url:(j&&j.url)||('idb:'+pathname),uploadedAt:Date.now(),local:false,size:pdfBlob.size||0});}catch(e){}
  pdfToast('Stored on Cloudflare · '+receiptNo,true);
  return j||{ok:true,pathname:pathname,receiptNo:receiptNo,kind:kind,view:view};
 }).catch(function(err){
  console.warn('Cloud store failed, falling back to local',err);
  pdfToast('Cloud failed — saving locally…',null);
  return finishLocal();
 });
}
function archivePdf(blob,filename,kind,receiptNo,view){
 return storeReceiptPdf(blob,{filename,kind,receiptNo,view});
}
function pdfWorkerOpts(paper,filename){
 return {margin:0,filename:filename,image:{type:'jpeg',quality:0.98},
  html2canvas:{scale:2,useCORS:true,backgroundColor:'#ffffff',ignoreElements:el=>el.id==='abPick'||(el.classList&&(el.classList.contains('sh-head')||el.classList.contains('sh-foot')||el.classList.contains('sm-sync')||el.classList.contains('msig-set')||el.classList.contains('no-print')))},
  jsPDF:{unit:'mm',format:paper,orientation:'portrait'},pagebreak:{mode:['css','legacy'],before:'.pb',avoid:['.fl','.fv','.cl>div','.s','h2','h3','.sg']}};
}
function makeReceiptPdfBlob(forceView){
 if(typeof html2pdf==='undefined')return Promise.reject(new Error('PDF tool did not load.'));
 const wasEditing=editing, wasView=view;
 if(editing){editing=false;}
 if(forceView==='small'||forceView==='one-page')view='small';
 else if(forceView==='full')view='full';
 buildBar();renderSheet();
 const sh=$('#sheet'),small=view==='small',paper=small?(state.settings.small.paper==='A4'?'a4':'a5'):'a4';
 const no=(state.receipt&&state.receipt.current)||'receipt';
 const kind=receiptKind();
 const vlabel=small?'one-page':'full';
 const filename=displayPdfName(no, vlabel, kind);
 document.body.classList.add('pdfing');
 /* html2pdf returns a Worker thenable — wrap in a native Promise (avoids n.resolve is not a function) */
 return new Promise(function(resolve, reject){
  try{
   html2pdf().set(pdfWorkerOpts(paper,filename)).from(sh).outputPdf('blob').then(function(blob){
    document.body.classList.remove('pdfing');
    if(wasEditing){editing=true;}
    if(forceView&&wasView!==view){view=wasView;buildBar();renderSheet();}
    else if(wasEditing){buildBar();renderSheet();}
    resolve({blob:blob,filename:filename,kind:kind,receiptNo:no,view:vlabel});
   }, function(e){
    document.body.classList.remove('pdfing');
    view=wasView;editing=wasEditing;buildBar();renderSheet();
    reject(e);
   });
  }catch(e){
   document.body.classList.remove('pdfing');
   view=wasView;editing=wasEditing;try{buildBar();renderSheet();}catch(err){}
   reject(e);
  }
 });
}
function storeCurrentReceiptToStorage(forceView){
 return makeReceiptPdfBlob(forceView).then(r=>{
  if(state.receipt&&state.receipt.current){state.receipt.printed=true;save(true);}
  return storeReceiptPdf(r.blob,{filename:r.filename,kind:r.kind,receiptNo:r.receiptNo,view:r.view});
 });

  function renderFiles(kids, files, receiptNo){

    kids.append(h('div',{class:'stor-tree-empty'},'No files'));

     splitBtn.addEventListener('click',e=>{

       receiptNo:file.receiptNo,

       view:(file.view==='one-page'||file.view==='small'||(!file.view&&/^(One-page-receipt|Paid-in-full-one-page)/i.test(String(file.filename||file.name||''))))?'one-page':'full',
       fromKind:file.kind,

  function loadFilesInto(kids, receiptNo){
   kids.innerHTML='';
   kids.append(h('div',{class:'stor-tree-empty'},'…'));
   const local=localFilesFor(receiptNo);
   const api=listApiUrl();
   const finish=(remote)=>{
    const stamped=(remote||[]).map(f=>Object.assign({},f,{receiptNo:f.receiptNo||receiptNo}));
    const all=[...(local||[]),...stamped];
    renderFiles(kids, dedupeFilesByFormat(all), receiptNo);
   };
   if(!api){finish([]);return;}
   fetch(listApiUrl(receiptNo)).then(r=>r.json()).then(d=>finish((d&&d.files)||[])).catch(()=>finish([]));
  }
  function refreshStorageList(preferExpandLatest, expandReceiptNo){
   const el=$('#storList');if(!el)return;
   const api=listApiUrl();
   const locals=localFolders();

   const paint=(folders)=>{
    el.innerHTML='';
    if(!folders.length){
     el.append(h('p',{class:'hint',style:'margin:0'},'No receipts stored yet.'));
     return;
    }
    let expandNo=expandReceiptNo||null;
    if(!expandNo&&preferExpandLatest)expandNo=folders[0]&&folders[0].receiptNo;
    const expandWant=String(expandNo||'').toLowerCase();
    folders.forEach(f=>{
     const row=h('div',{class:'stor-tree-row'});
     const line=h('button',{type:'button',class:'stor-tree-line'},
      h('span',{class:'stor-folder-icon','aria-hidden':'true'}),
      h('span',{},(f.receiptNo||'?')+(f.count?(' · '+f.count):''))
     );
     line.title='Click to expand · hold 3s to delete all PDFs for this number';
     const kids=h('div',{class:'stor-tree-kids'});
     kids.hidden=true;
     let folderArmed=false;
     line.addEventListener('click',e=>{
      if(folderArmed){folderArmed=false;e.preventDefault();e.stopPropagation();return;}
      const wasOpen=row.classList.contains('open');
      el.querySelectorAll('.stor-tree-row.open').forEach(r=>{r.classList.remove('open');const k=r.querySelector('.stor-tree-kids');if(k)k.hidden=true;});
      if(!wasOpen){row.classList.add('open');kids.hidden=false;loadFilesInto(kids, f.receiptNo);}
     });
     bindHoldDelete(line, ()=>{
      folderArmed=true;
      deleteStoredFolder(f.receiptNo).then(()=>refreshStorageList(false));
     }, 'Hold 3s to delete all PDFs under '+f.receiptNo);
     row.append(line, kids);
     el.append(row);
     if(expandWant&&String(f.receiptNo||'').toLowerCase()===expandWant){
      row.classList.add('open');kids.hidden=false;loadFilesInto(kids, f.receiptNo);
     }
    });
   };

   /* always paint locals immediately — never stick on Loading… */
   if(!api){paint(locals);return;}
   paint(locals);
   fetch(api).then(r=>r.json()).then(data=>{
    const remote=(data&&data.folders)||[];
    const merged=new Map();
    locals.forEach(f=>merged.set(String(f.receiptNo).toUpperCase(),{...f}));
    remote.forEach(f=>{
     const rno=normalizeReceiptNo(f.receiptNo);
     if(!rno||isJunkReceiptFolder(rno))return;
     const cur=merged.get(rno)||{receiptNo:rno,count:0,latest:0};
     cur.count=(cur.count||0)+(f.count||0);
     cur.latest=Math.max(cur.latest||0,f.latest||0);
     merged.set(rno,cur);
    });
    paint([...merged.values()].sort((a,b)=>(b.latest||0)-(a.latest||0)));
   }).catch(()=>paint(locals));
  }
  return wrap;
 });
}

/* ---------- website sharing ---------- */
function reEsc(x){return x.replace(/[.*+?^${}()|[\]\\\/]/g,'\\$&');}
const domOf=u=>u.replace(/^[a-z]+:\/\//i,'').replace(/\/+$/,'');
function chainSite(str){
 if(!W||!str)return str;
 const alts=[W,D].filter(x=>x&&x.length>=4).sort((a,b)=>b.length-a.length);
 if(!alts.length)return str;
 return str.replace(new RegExp(alts.map(reEsc).join('|'),'gi'),m=>m.toLowerCase()===W.toLowerCase()?'{website}':'{domain}');
}
function replaceSite(oldU,newU){
 if(!oldU||!newU||oldU===newU||oldU.length<4)return 0;
 const oD=domOf(oldU),nD=domOf(newU);let count=0;
 const js=x=>JSON.stringify(x).slice(1,-1);
 const alts=[oldU,oD].filter(Boolean).sort((a,b)=>b.length-a.length);
 const re=new RegExp(alts.map(a=>reEsc(js(a))).join('|'),'g');
 const fix=str=>str.replace(re,m=>{count++;return m===js(oldU)?js(newU):js(nD);});
 state.blocks=JSON.parse(fix(JSON.stringify(state.blocks)));
 ['headerLeft','headerRight','footerLeft'].forEach(k=>{if(typeof state.settings[k]==='string')state.settings[k]=JSON.parse('"'+fix(js(state.settings[k]))+'"');});
 return count;
}
function siteUsage(){
 const out=[];if(!W)return out;
 const alts=[W,D].filter(Boolean).sort((a,b)=>b.length-a.length).map(a=>reEsc(JSON.stringify(a).slice(1,-1)));
 const re=new RegExp('\\{website\\}|\\{domain\\}|'+alts.join('|'),'g');
 const scan=str=>{let shared=0,typed=0;(str.match(re)||[]).forEach(m=>{if(m[0]==='{')shared++;else typed++;});return{shared,typed};};
 state.blocks.forEach(b=>{const r=scan(JSON.stringify(b,(k,v)=>(k==='src'||k==='image')?undefined:v));if(r.shared||r.typed)out.push({b,...r});});
 const hf=scan(JSON.stringify([state.settings.headerLeft,state.settings.headerRight,state.settings.footerLeft]));
 if(hf.shared||hf.typed)out.push({hf:true,...hf});
 return out;
}

/* ---------- in-place editing: actions ---------- */
function move(arr,i,d){const j=i+d;if(i<0||j<0||j>=arr.length)return false;[arr[i],arr[j]]=[arr[j],arr[i]];return true;}
function insertBlock(afterIdx,type){
 const nb=Object.assign({id:uid(),type},TYPES[type][1]());
 state.blocks.splice(afterIdx+1,0,nb);cur=nb.id;save();renderSheet();
 const el=document.querySelector(`.blk[data-bid="${nb.id}"] [contenteditable]`);
 if(el){el.focus();placeEnd(el);}jump(nb.id);
}
function act(t){
 const a=t.dataset.act,b=state.blocks.find(x=>x.id===t.dataset.b),i=+t.dataset.i,p=t.dataset.p,bi=b?state.blocks.indexOf(b):-1;
 let focusPrefix=null;
 if(['b-up','b-down','b-del','up','down','del'].includes(a))formStash={};
 switch(a){
  case 'set-sig':signatureDialog();return;
  case 'b-up':move(state.blocks,bi,-1);break;
  case 'b-down':move(state.blocks,bi,1);break;
  case 'b-dup':{const c=clone(b);c.id=uid();(c.rows||[]).forEach(r=>{delete r.rid;(r.options||[]).forEach(o=>{if(o.id)o.id=uid();});});delete c.strikeWhen;state.blocks.splice(bi+1,0,c);cur=c.id;break;}
  case 'b-del':if(!confirm('Delete this block?'))return;state.blocks.splice(bi,1);cur=null;break;
  case 'b-set':blockDialog(b);return;
  case 'b-ins':typeDialog(k=>insertBlock(bi,k));return;
  case 'b-add-end':typeDialog(k=>insertBlock(state.blocks.length-1,k));return;
  case 'up':{const arr=getP(b,p);move(arr,i,-1);break;}
  case 'down':{const arr=getP(b,p);move(arr,i,1);break;}
  case 'del':{const arr=getP(b,p);arr.splice(i,1);break;}
  case 'add':{const arr=getP(b,p);arr.push(maker(b,p));focusPrefix=p+'.'+(arr.length-1)+'.';break;}
  case 'optmode':{const o=getP(b,p)[i],cu=o.entry||(o.blank?'blank':''),nx={'':'blank',blank:'auto',auto:''}[cu];o.entry=nx;delete o.blank;break;}
  case 'rowset':rowDialog(b,i);return;
  case 'imgrep':pickImage(b,`items.${i}.src`);return;
  case 'imgw':{const it=getP(b,`items.${i}`);it.w=Math.max(60,Math.min(640,(+it.w||200)+(+t.dataset.d)));break;}
  case 'sp':b.h=Math.max(0,(+b.h||0)+(+t.dataset.d));break;
  case 'qrlink':b.qrText=b.qrText==='{website}'?(state.settings.website||''):'{website}';break;
  case 'qrpic':pickImage(b,'image',()=>{b.qrText='';});return;
  case 'b-hide':b.hidden=!b.hidden;break;
  default:return;
 }
 save();renderSheet();
 if(focusPrefix){const el=document.querySelector(`[contenteditable][data-b="${b.id}"][data-p^="${focusPrefix}"]`);if(el){el.focus();placeEnd(el);}}
}

let siteFocus='';
function finalizeEdit(el){
 const b=state.blocks.find(x=>x.id===el.dataset.b)||null,p=el.dataset.p;
 let v=String(getP(b,p)==null?'':getP(b,p)).trim(),rerender=false;
 if(p==='@website'){
  const n=replaceSite(siteFocus,v);setSite();rerender=true;
  const st=$('#st');if(st&&n)st.textContent='Website changed — also replaced '+n+' typed copy(ies)';
 }else{
  const c=chainSite(v);if(c!==v){v=c;rerender=true;}
  if(/(^|\.)(dateEn|dateZh|capEn|capZh)$/.test(p)||p.startsWith('@s.'))rerender=true;
 }
 setP(b,p,v);clearTimeout(saveT);save();
 if(rerender)afterClick(()=>renderSheet());
}
const app=$('#app');
app.addEventListener('input',e=>{
 const el=e.target;if(!el||!el.matches)return;
 if(editing&&el.matches('[contenteditable][data-p]')){
  const b=state.blocks.find(x=>x.id===el.dataset.b)||null;
  setP(b,el.dataset.p,el.textContent.replace(/\u00a0/g,' '));
  if(el.dataset.p==='@website')setSite();
  saveLater();return;
 }
 if(!editing&&el.classList.contains('dt')){
  const f=fmtDate(el.value);if(f!==el.value){el.value=f;try{el.setSelectionRange(f.length,f.length);}catch(x){}}
 }
});

app.addEventListener('focusout',e=>{
 const el=e.target;if(!el||!el.matches)return;
 if(editing&&el.matches('[contenteditable][data-p]')){finalizeEdit(el);return;}
 if(!editing&&el.classList.contains('cin'))commitCustom(el.closest('.cst'));
});
app.addEventListener('keydown',e=>{

});

app.addEventListener('click',e=>{
 if(editing){
  const t=e.target.closest('[data-act]');if(t){e.preventDefault();act(t);return;}
  const blk=e.target.closest('.blk');
  if(blk&&blk.dataset.bid!==cur){cur=blk.dataset.bid;document.querySelectorAll('.blk').forEach(x=>x.classList.toggle('sel',x.dataset.bid===cur));}
  return;
 }
 const tb=e.target.closest('.today');if(tb){const bx=tb.closest('[data-dt]'),i=bx&&bx.querySelector('.dt');if(i){i.value=todayStr();i.focus();}return;}
 const a=e.target.closest('.addtr');if(a){e.preventDefault();addTranslation(a.dataset.v,a.closest('.cst'));return;}
 const r=e.target.closest('.cres');if(r&&!r.hidden){const w=r.closest('.cst');r.hidden=true;w.querySelector('.clab').hidden=false;const i=w.querySelector('.cin');i.hidden=false;i.focus();}
});

/* ---------- date field + custom entries (receipt filling) ---------- */
function fmtDate(raw){
 let y='',m='',d='';
 for(const c of raw.replace(/\D/g,'')){
  const n=+c;
  if(y.length<4)y+=c;
  else if(m.length<2){
   if(m==='')m=n>1?'0'+c:c;
   else if(m==='0'){if(n>0)m+=c;}
   else if(n<=2)m+=c;
  }else if(d.length<2){
   if(d==='')d=n>3?'0'+c:c;
   else if(d==='0'){if(n>0)d+=c;}
   else if(d==='3'){if(n<=1)d+=c;}
   else d+=c;
  }
 }
 if(m.length===2&&d.length===2&&+y>0){const mx=new Date(+y,+m,0).getDate();if(+d>mx)d=String(mx).padStart(2,'0');}
 return y+(m?'-'+m:'')+(d?'-'+d:'');
}
function todayStr(){return todayISO();}
function commitCustom(w){
 if(!w)return;const inp=w.querySelector('.cin'),res=w.querySelector('.cres'),lab=w.querySelector('.clab'),cb=w.querySelector('input[type=checkbox]');
 const v=inp.value.trim();
 if(!v){res.hidden=true;res.innerHTML='';lab.hidden=false;inp.hidden=false;cb.checked=false;return;}
 const t=translate(v);
 res.innerHTML=t.known?bi(t.en,t.zh):`<span class="uk">${esc(v)}</span><a class="addtr" href="#" data-v="${esc(v)}">+ translation</a>`;
 res.hidden=false;lab.hidden=true;inp.hidden=true;cb.checked=true;
}
function addTranslation(v,w){
 const cjk=CJK.test(v),a=prompt(cjk?'English for “'+v+'”?':'中文 for “'+v+'”?');if(!a||!a.trim())return;
 state.glossary.push(cjk?{en:a.trim(),zh:v}:{en:v.replace(/\b\w/g,c=>c.toUpperCase()),zh:a.trim()});save();commitCustom(w);
}

window.ArkApp={id:'arkorigin-receipt',version:VERSION,getConfig:()=>clone(state),setConfig:c=>loadState(clone(c))};

else if(window.__VERSY_RECEIPT_VIEW==='full') view='full';

<script>

<script>

function norm(el){if(!el.matches||!el.matches('input[type=text]'))return;var l=(el.getAttribute('aria-label')||'');if(!/^size/i.test(l))return;
 var m=el.value.trim().match(/^([ab][0-6])\b\s*(.*)$/i);if(!m)return;var k=m[1].toLowerCase();if(!A[k])return;
 if(m[2]&&/\d/.test(m[2]))return;var v=k.toUpperCase()+' '+A[k]+' mm';if(el.value!==v){el.value=v;el.dispatchEvent(new Event('input',{bubbles:true}));el.dispatchEvent(new Event('change',{bubbles:true}));}}
document.addEventListener('input',function(e){var el=e.target;if(/^\s*[ab][0-6]\s*$/i.test(el.value||''))norm(el);},false);
