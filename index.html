<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Versy receipts</title>
<style>
:root{--navy:#1F2A44;--accent:#a53a2a;--muted:#5F6673;--line:#C9CDD4;--bg:#F3F4F6}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI","Helvetica Neue",Arial,"Microsoft JhengHei",sans-serif;background:var(--bg);color:#111}
header{background:#fff;border-bottom:1px solid var(--line);padding:14px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header h1{margin:0;font-size:18px;color:var(--navy)}
header .sub{color:var(--muted);font-size:13px}
header .sp{flex:1}
a.btn{appearance:none;border:1px solid var(--line);background:#fff;color:var(--navy);font:600 13px system-ui;padding:8px 14px;border-radius:8px;cursor:pointer;text-decoration:none}
a.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
main{max-width:720px;margin:24px auto;padding:0 16px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:flex;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.row:last-child{border-bottom:0}
.row:hover{background:#fafbfc}
.row .t{font-weight:600;flex:1;min-width:0}
.row .m{font-size:12px;color:var(--muted);white-space:nowrap}
.empty{padding:28px 14px;color:var(--muted);text-align:center}
.ver{font-size:11px;color:var(--muted);margin-top:16px;text-align:center}
</style>
</head>
<body>
<header>
  <div>
    <h1>Versy receipts</h1>
    <div class="sub">Paperworks · Artwork Purchase Receipt</div>
  </div>
  <div class="sp"></div>
  <a class="btn primary" id="newBtn" href="#">New receipt</a>
</header>
<main>
  <div class="card" id="list"><div class="empty">Loading…</div></div>
  <p class="ver">Host 0.1 · template v0.19 · 26.10.17 · fills persist in this browser</p>
</main>
<script>
(function(){
  const INDEX_KEY='versy-receipts-index-v1';
  function nid(){return 'r-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8);}
  document.getElementById('newBtn').href='/receipt.html?id='+encodeURIComponent(nid());
  function fmt(ts){try{return new Date(ts).toLocaleString();}catch(e){return '';}}
  function esc(s){return String(s||'').replace(/[&<>"']/g,function(c){return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];});}
  let list=[];
  try{list=JSON.parse(localStorage.getItem(INDEX_KEY)||'[]');}catch(e){list=[];}
  if(!Array.isArray(list))list=[];
  const el=document.getElementById('list');
  if(!list.length){
    el.innerHTML='<div class="empty">No saved receipts yet. Start with <b>New receipt</b> — fills stay in this browser after reload.</div>';
    return;
  }
  el.innerHTML=list.map(function(r){
    return '<a class="row" href="/receipt.html?id='+encodeURIComponent(r.id)+'">'+
      '<div class="t">'+esc(r.title||'Untitled receipt')+(r.receiptNo?' <span class="m">· '+esc(r.receiptNo)+'</span>':'')+'</div>'+
      '<div class="m">'+esc(fmt(r.updatedAt))+'</div></a>';
  }).join('');
})();
</script>
</body>
</html>
