<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Versy receipts</title>
<style>
:root{--navy:#1F2A44;--accent:#a53a2a;--muted:#5F6673;--line:#C9CDD4;--bg:#F3F4F6}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI","Helvetica Neue",Arial,"Microsoft JhengHei",sans-serif;background:var(--bg);color:#111}
header{background:#fff;border-bottom:1px solid var(--line);padding:14px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header h1{margin:0;font-size:18px;color:var(--navy)}
header .sub{color:var(--muted);font-size:13px}
header .sp{flex:1}
main{max-width:640px;margin:40px auto;padding:0 16px}
.tiles{display:grid;gap:12px}
a.tile{display:block;background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px 16px;text-decoration:none;color:inherit;transition:border-color .15s,box-shadow .15s}
a.tile:hover{border-color:var(--navy);box-shadow:0 2px 10px rgba(0,0,0,.06)}
a.tile.primary{border-color:var(--accent);background:#fff}
a.tile .t{font-weight:700;font-size:16px;color:var(--navy)}
a.tile.primary .t{color:var(--accent)}
a.tile .d{margin-top:4px;font-size:13px;color:var(--muted);line-height:1.4}
.ver{font-size:11px;color:var(--muted);margin-top:20px;text-align:center}
</style>
</head>
<body>
<header>
  <div>
    <h1>Versy receipts</h1>
    <div class="sub">Paperworks · Artwork Purchase Receipt</div>
  </div>
  <div class="sp"></div>
</header>
<main>
  <div class="tiles">
    <a class="tile primary" id="newBtn" href="#">
      <div class="t">New receipt</div>
      <div class="d">Start a blank purchase receipt · 開新收據</div>
    </a>
    <a class="tile" id="paidBtn" href="#">
      <div class="t">Paid in full · 已全額支付</div>
      <div class="d">Settlement receipt — same layout, final-payment body</div>
    </a>
    <a class="tile" id="storBtn" href="#">
      <div class="t">Storage · 存檔</div>
      <div class="d">Drop and browse PDFs by receipt number</div>
    </a>
  </div>
  <p class="ver">Host 0.3 · template v0.65 · 27.10.26</p>
</main>
<script>
(function(){
  function nid(){return 'r-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8);}
  document.getElementById('newBtn').href='receipt.html?id='+encodeURIComponent(nid());
  document.getElementById('paidBtn').href='receipt.html?id='+encodeURIComponent(nid())+'&kind=paid-in-full';
  document.getElementById('storBtn').href='receipt.html?id='+encodeURIComponent(nid())+'&storage=1';
})();
</script>
</body>
</html>
